$kind: http-request
name: Get Todo
method: GET
url: '{{vault:gin_todo_api_mcp_base_url}}/todos/{{todoId}}'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has correct structure", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id").that.is.a("number");
          pm.expect(json).to.have.property("title").that.is.a("string");
          pm.expect(json).to.have.property("completed").that.is.a("boolean");
      });

      pm.test("Returns the correct todo", function () {
          const json = pm.response.json();
          const todoId = pm.collectionVariables.get("todoId");
          pm.expect(json.id).to.eql(Number(todoId));
      });