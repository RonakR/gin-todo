$kind: http-request
name: Create Todo
method: POST
url: '{{vault:gin_todo_api_mcp_base_url}}/todos'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Buy groceries"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Response has correct structure", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.expect(json).to.have.property("title");
          pm.expect(json).to.have.property("completed");
          pm.expect(json.id).to.be.a("number");
          pm.expect(json.title).to.eql("Buy groceries");
          pm.expect(json.completed).to.eql(false);
      });

      pm.test("Store todo ID for later requests", function () {
          const json = pm.response.json();
          pm.collectionVariables.set("todoId", json.id);
      });