$kind: http-request
name: List Todos
method: GET
url: '{{vault:gin_todo_api_mcp_base_url}}/todos'
order: 3000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is an array", function () {
          const json = pm.response.json();
          pm.expect(json).to.be.an("array");
      });

      pm.test("Each todo has correct structure", function () {
          const json = pm.response.json();
          json.forEach(function (todo) {
              pm.expect(todo).to.have.property("id").that.is.a("number");
              pm.expect(todo).to.have.property("title").that.is.a("string");
              pm.expect(todo).to.have.property("completed").that.is.a("boolean");
          });
      });